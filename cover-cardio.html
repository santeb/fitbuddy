<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>心肺训练封面</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #1a1a1a;
  }
  .cover {
    width: 750px;
    height: 1000px;
    background: linear-gradient(160deg, #0d0d0d 0%, #2d0a0a 30%, #8b1a1a 60%, #d63031 100%);
    position: relative;
    overflow: hidden;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 60px 50px;
  }
  /* 顶部标签 */
  .tag-bar {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .tag-bar .badge {
    background: #ff4757;
    color: #fff;
    font-size: 24px;
    font-weight: 700;
    padding: 6px 16px;
    border-radius: 6px;
    letter-spacing: 2px;
  }
  .tag-bar .num {
    color: rgba(255,255,255,0.5);
    font-size: 22px;
    font-weight: 600;
  }
  /* 中间标题区 */
  .title-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 20px;
  }
  .main-title {
    font-size: 82px;
    font-weight: 900;
    line-height: 1.15;
    color: #fff;
    letter-spacing: 2px;
    text-shadow: 0 4px 30px rgba(255,71,87,0.4);
  }
  .main-title .red {
    color: #ff6b6b;
  }
  .main-title .strike {
    text-decoration: line-through;
    text-decoration-color: #ff4757;
    text-decoration-thickness: 4px;
  }
  .sub-title {
    font-size: 44px;
    font-weight: 700;
    color: #ffa502;
    letter-spacing: 1px;
  }
  .sub-title .emoji {
    font-size: 48px;
  }
  /* 装饰线 */
  .deco-line {
    width: 80px;
    height: 5px;
    background: linear-gradient(90deg, #ff4757, #ffa502);
    border-radius: 3px;
    margin-top: 10px;
  }
  /* 底部 */
  .bottom-area {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  .bottom-left {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .keyword {
    font-size: 26px;
    color: rgba(255,255,255,0.6);
    font-weight: 600;
    letter-spacing: 3px;
  }
  .keyword span {
    color: #ff6b6b;
  }
  .bottom-right {
    text-align: right;
  }
  .bottom-right .label {
    font-size: 22px;
    color: rgba(255,255,255,0.4);
    font-weight: 600;
  }
  /* 装饰光点 */
  .glow-dot {
    position: absolute;
    border-radius: 50%;
    filter: blur(40px);
    opacity: 0.15;
  }
  .glow-dot:nth-child(1) {
    width: 300px;
    height: 300px;
    background: #ff4757;
    top: -50px;
    right: -50px;
  }
  .glow-dot:nth-child(2) {
    width: 200px;
    height: 200px;
    background: #ffa502;
    bottom: 100px;
    left: -30px;
  }
</style>
</head>
<body>
  <div class="cover">
    <div class="glow-dot"></div>
    <div class="glow-dot"></div>

    <div class="tag-bar">
      <span class="badge">健身干货</span>
      <span class="num">No.06</span>
    </div>

    <div class="title-area">
      <div class="main-title">
        你以为<br>
        <span class="strike">心肺训练</span><br>
        <span class="red">= 跑步？</span>
      </div>
      <div class="deco-line"></div>
      <div class="sub-title">难怪你越练越累 <span class="emoji">💥</span></div>
    </div>

    <div class="bottom-area">
      <div class="bottom-left">
        <div class="keyword"><span>HIIT</span> · <span>LISS</span> · <span>心率区间</span></div>
        <div class="keyword"><span>周期化</span> · <span>RPE</span></div>
      </div>
      <div class="bottom-right">
        <div class="label">收藏学起来</div>
      </div>
    </div>
  </div>
</body>
</html>
