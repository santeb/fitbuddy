<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>保加利亚分腿蹲 · 动作分镜</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    background: #eef1f5;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    padding: 56px 60px 48px;
  }
  .header h1 {
    font-size: 44px;
    font-weight: 900;
    color: #1c2436;
    letter-spacing: 1px;
    line-height: 1.1;
  }
  .header .sub {
    margin-top: 8px;
    font-size: 20px;
    color: #5a6478;
    font-weight: 500;
    line-height: 1.4;
  }
  .header .divider {
    margin-top: 14px;
    height: 1px;
    background: #d4dae3;
  }
  .grid {
    margin-top: 22px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
  }
  .cell {
    background: #ffffff;
    border-radius: 14px;
    border: 1px solid #dfe4ec;
    padding: 12px 12px 10px;
    display: flex;
    flex-direction: column;
  }
  .cell .stage {
    flex: 1;
    background: #ffffff;
    border-radius: 8px;
    position: relative;
    overflow: hidden;
  }
  .cell .stage svg { width: 100%; height: 100%; display: block; }
  .step-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 8px;
    font-size: 18px;
    font-weight: 800;
    color: #1c2436;
  }
  .step-tag .num {
    width: 32px; height: 32px; line-height: 32px; text-align: center;
    border-radius: 6px;
    color: #fff;
    font-size: 18px;
    font-weight: 800;
  }
  .step-tag .num.c1 { background: #2f3a4f; }
  .step-tag .num.c2 { background: #4361ee; }
  .step-tag .num.c3 { background: #6c8aff; }
  .step-tag .num.c4 { background: #e94e3b; }
  .step-tag .num.c5 { background: #2ea86a; }
  .step-tag .num.c6 { background: #1c2436; }
  .step-tag .label { color: #1c2436; }
  .caption {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid #eef0f4;
    font-size: 15px;
    color: #4a5266;
    font-weight: 500;
    line-height: 1.35;
    min-height: 40px;
  }
  .footer {
    margin-top: 18px;
    padding-top: 12px;
    border-top: 1px solid #d4dae3;
    font-size: 14px;
    color: #7a8194;
    line-height: 1.5;
  }
  .footer .key { color: #4a5266; font-weight: 700; }
</style>
</head>
<body>
  <div class="header">
    <h1>保加利亚分腿蹲 · 动作分镜</h1>
    <div class="sub">后脚搭凳、前脚踩地，六格看懂「髋向下 → 底部 → 起身」</div>
    <div class="divider"></div>
  </div>

  <div class="grid">
    <!-- 1 起始·站直 -->
    <div class="cell">
      <div class="step-tag"><span class="num c1">①</span><span class="label">起始·站直</span></div>
      <div class="stage">
        <svg viewBox="0 0 300 320" xmlns="http://www.w3.org/2000/svg">
          <!-- 凳 -->
          <g stroke="#aab2c0" stroke-width="3" stroke-linecap="round" fill="none">
            <rect x="20" y="200" width="80" height="14" rx="2" fill="#cdd4de"/>
            <line x1="32" y1="214" x2="32" y2="290"/>
            <line x1="86" y1="214" x2="86" y2="290"/>
            <line x1="14" y1="290" x2="106" y2="290" stroke-dasharray="3 5"/>
          </g>
          <!-- 火柴人：站直，后脚脚背搭凳 -->
          <g stroke="#1c2436" stroke-width="6" stroke-linecap="round" fill="none">
            <!-- 头 -->
            <circle cx="200" cy="80" r="20" fill="#ffffff"/>
            <!-- 躯干 -->
            <line x1="200" y1="100" x2="200" y2="200"/>
            <!-- 髋→前脚（直立） -->
            <line x1="200" y1="200" x2="180" y2="290"/>
            <!-- 前脚：略前伸到地面 -->
            <line x1="180" y1="290" x2="220" y2="290"/>
            <!-- 后脚：从髋往后到凳面 y=200 -->
            <line x1="200" y1="200" x2="80" y2="207"/>
            <!-- 哑铃（双手垂） -->
            <line x1="200" y1="140" x2="175" y2="210"/>
            <line x1="200" y1="140" x2="225" y2="210"/>
          </g>
          <!-- 哑铃片 -->
          <g fill="#aab2c0">
            <rect x="155" y="200" width="40" height="20" rx="4"/>
            <rect x="205" y="200" width="40" height="20" rx="4"/>
          </g>
        </svg>
      </div>
      <div class="caption">后脚脚背搭凳，前脚踩实</div>
    </div>

    <!-- 2 下沉 1/3 -->
    <div class="cell">
      <div class="step-tag"><span class="num c2">②</span><span class="label">下沉 1/3</span></div>
      <div class="stage">
        <svg viewBox="0 0 300 320" xmlns="http://www.w3.org/2000/svg">
          <g stroke="#aab2c0" stroke-width="3" stroke-linecap="round" fill="none">
            <rect x="20" y="200" width="80" height="14" rx="2" fill="#cdd4de"/>
            <line x1="32" y1="214" x2="32" y2="290"/>
            <line x1="86" y1="214" x2="86" y2="290"/>
            <line x1="14" y1="290" x2="106" y2="290" stroke-dasharray="3 5"/>
          </g>
          <g stroke="#1c2436" stroke-width="6" stroke-linecap="round" fill="none">
            <circle cx="200" cy="80" r="20" fill="#ffffff"/>
            <!-- 髋稍沉，躯干略前倾 -->
            <line x1="200" y1="100" x2="195" y2="215"/>
            <!-- 髋→前膝(微屈) -->
            <line x1="195" y1="215" x2="180" y2="260"/>
            <!-- 前膝→前脚 -->
            <line x1="180" y1="260" x2="220" y2="290"/>
            <!-- 后脚到凳 -->
            <line x1="195" y1="215" x2="80" y2="207"/>
            <!-- 哑铃 -->
            <line x1="195" y1="140" x2="170" y2="220"/>
            <line x1="195" y1="140" x2="220" y2="220"/>
          </g>
          <g fill="#aab2c0">
            <rect x="150" y="210" width="40" height="20" rx="4"/>
            <rect x="200" y="210" width="40" height="20" rx="4"/>
          </g>
        </svg>
      </div>
      <div class="caption">髋向下方沉</div>
    </div>

    <!-- 3 下沉 2/3 -->
    <div class="cell">
      <div class="step-tag"><span class="num c3">③</span><span class="label">下沉 2/3</span></div>
      <div class="stage">
        <svg viewBox="0 0 300 320" xmlns="http://www.w3.org/2000/svg">
          <g stroke="#aab2c0" stroke-width="3" stroke-linecap="round" fill="none">
            <rect x="20" y="200" width="80" height="14" rx="2" fill="#cdd4de"/>
            <line x1="32" y1="214" x2="32" y2="290"/>
            <line x1="86" y1="214" x2="86" y2="290"/>
            <line x1="14" y1="290" x2="106" y2="290" stroke-dasharray="3 5"/>
          </g>
          <!-- 踝垂线 -->
          <line x1="220" y1="60" x2="220" y2="290" stroke="#cdd4de" stroke-width="1.5" stroke-dasharray="4 5"/>
          <g stroke="#1c2436" stroke-width="6" stroke-linecap="round" fill="none">
            <circle cx="200" cy="80" r="20" fill="#ffffff"/>
            <line x1="200" y1="100" x2="190" y2="225"/>
            <!-- 髋→膝 -->
            <line x1="190" y1="225" x2="195" y2="275"/>
            <line x1="195" y1="275" x2="220" y2="290"/>
            <line x1="190" y1="225" x2="80" y2="207"/>
            <line x1="190" y1="140" x2="170" y2="230"/>
            <line x1="190" y1="140" x2="215" y2="230"/>
          </g>
          <g fill="#aab2c0">
            <rect x="150" y="220" width="40" height="20" rx="4"/>
            <rect x="195" y="220" width="40" height="20" rx="4"/>
          </g>
        </svg>
      </div>
      <div class="caption">前膝落在脚尖以内</div>
    </div>

    <!-- 4 底部 -->
    <div class="cell">
      <div class="step-tag"><span class="num c4">④</span><span class="label">底部</span></div>
      <div class="stage">
        <svg viewBox="0 0 300 320" xmlns="http://www.w3.org/2000/svg">
          <g stroke="#aab2c0" stroke-width="3" stroke-linecap="round" fill="none">
            <rect x="20" y="200" width="80" height="14" rx="2" fill="#cdd4de"/>
            <line x1="32" y1="214" x2="32" y2="290"/>
            <line x1="86" y1="214" x2="86" y2="290"/>
            <line x1="14" y1="290" x2="106" y2="290" stroke-dasharray="3 5"/>
          </g>
          <!-- 踝垂线 -->
          <line x1="220" y1="60" x2="220" y2="290" stroke="#cdd4de" stroke-width="1.5" stroke-dasharray="4 5"/>
          <g stroke="#1c2436" stroke-width="6" stroke-linecap="round" fill="none">
            <circle cx="200" cy="80" r="20" fill="#ffffff"/>
            <!-- 躯干明显前倾 -->
            <line x1="200" y1="100" x2="180" y2="245"/>
            <!-- 髋 -->
            <line x1="180" y1="245" x2="80" y2="207"/>
            <!-- 髋→膝（深蹲位） -->
            <line x1="180" y1="245" x2="195" y2="290"/>
            <!-- 膝→前脚（贴地） -->
            <line x1="195" y1="290" x2="230" y2="290"/>
            <!-- 哑铃垂到最低 -->
            <line x1="180" y1="140" x2="160" y2="245"/>
            <line x1="180" y1="140" x2="200" y2="245"/>
          </g>
          <g fill="#aab2c0">
            <rect x="140" y="235" width="40" height="20" rx="4"/>
            <rect x="180" y="235" width="40" height="20" rx="4"/>
          </g>
          <!-- 后膝到底的红色提示 -->
          <line x1="100" y1="285" x2="160" y2="285" stroke="#e94e3b" stroke-width="2.5" stroke-dasharray="6 4"/>
        </svg>
      </div>
      <div class="caption">后膝降到最低，别顶地</div>
    </div>

    <!-- 5 起身·蹬地 -->
    <div class="cell">
      <div class="step-tag"><span class="num c5">⑤</span><span class="label">起身·蹬地</span></div>
      <div class="stage">
        <svg viewBox="0 0 300 320" xmlns="http://www.w3.org/2000/svg">
          <g stroke="#aab2c0" stroke-width="3" stroke-linecap="round" fill="none">
            <rect x="20" y="200" width="80" height="14" rx="2" fill="#cdd4de"/>
            <line x1="32" y1="214" x2="32" y2="290"/>
            <line x1="86" y1="214" x2="86" y2="290"/>
            <line x1="14" y1="290" x2="106" y2="290" stroke-dasharray="3 5"/>
          </g>
          <!-- 前脚三点 -->
          <circle cx="220" cy="290" r="4" fill="#2ea86a"/>
          <circle cx="180" cy="290" r="4" fill="#2ea86a"/>
          <circle cx="200" cy="290" r="4" fill="#2ea86a"/>
          <g stroke="#1c2436" stroke-width="6" stroke-linecap="round" fill="none">
            <circle cx="200" cy="80" r="20" fill="#ffffff"/>
            <line x1="200" y1="100" x2="190" y2="220"/>
            <line x1="190" y1="220" x2="195" y2="270"/>
            <line x1="195" y1="270" x2="220" y2="290"/>
            <line x1="190" y1="220" x2="80" y2="207"/>
            <line x1="190" y1="140" x2="170" y2="225"/>
            <line x1="190" y1="140" x2="215" y2="225"/>
          </g>
          <g fill="#aab2c0">
            <rect x="150" y="215" width="40" height="20" rx="4"/>
            <rect x="195" y="215" width="40" height="20" rx="4"/>
          </g>
        </svg>
      </div>
      <div class="caption">前脚掌三点蹬地</div>
    </div>

    <!-- 6 回顶·换气 -->
    <div class="cell">
      <div class="step-tag"><span class="num c6">⑥</span><span class="label">回顶·换气</span></div>
      <div class="stage">
        <svg viewBox="0 0 300 320" xmlns="http://www.w3.org/2000/svg">
          <g stroke="#aab2c0" stroke-width="3" stroke-linecap="round" fill="none">
            <rect x="20" y="200" width="80" height="14" rx="2" fill="#cdd4de"/>
            <line x1="32" y1="214" x2="32" y2="290"/>
            <line x1="86" y1="214" x2="86" y2="290"/>
            <line x1="14" y1="290" x2="106" y2="290" stroke-dasharray="3 5"/>
          </g>
          <g stroke="#1c2436" stroke-width="6" stroke-linecap="round" fill="none">
            <circle cx="200" cy="80" r="20" fill="#ffffff"/>
            <line x1="200" y1="100" x2="200" y2="200"/>
            <line x1="200" y1="200" x2="180" y2="290"/>
            <line x1="180" y1="290" x2="220" y2="290"/>
            <line x1="200" y1="200" x2="80" y2="207"/>
            <line x1="200" y1="140" x2="175" y2="210"/>
            <line x1="200" y1="140" x2="225" y2="210"/>
          </g>
          <g fill="#aab2c0">
            <rect x="155" y="200" width="40" height="20" rx="4"/>
            <rect x="205" y="200" width="40" height="20" rx="4"/>
          </g>
          <!-- 换气提示 -->
          <text x="250" y="100" font-family="PingFang SC, sans-serif" font-size="22" font-weight="700" fill="#4361ee" text-anchor="middle">呼</text>
        </svg>
      </div>
      <div class="caption">起身膝盖不锁死</div>
    </div>
  </div>

  <div class="footer">
    <span class="key">灰虚线</span> = 前脚踝垂线 · <span class="key">前膝</span> 落在脚尖以内 · <span class="key">后腿</span> 只负责平衡，不发力
  </div>
</body>
</html>
