<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>练后恢复封面</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1500px;
    height: 2000px;
    overflow: hidden;
    background: #0a0a0f;
  }
  .cover {
    width: 750px;
    height: 1000px;
    transform: scale(2);
    transform-origin: 0 0;
    background: linear-gradient(160deg, #070b14 0%, #0d1b2e 35%, #0f3460 65%, #155e75 100%);
    position: relative;
    overflow: hidden;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 60px 50px;
  }
  .tag-bar {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .tag-bar .badge {
    background: #00e5a0;
    color: #06251c;
    font-size: 24px;
    font-weight: 700;
    padding: 6px 16px;
    border-radius: 6px;
    letter-spacing: 2px;
  }
  .tag-bar .num {
    color: rgba(255,255,255,0.5);
    font-size: 22px;
    font-weight: 600;
  }
  .title-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 20px;
  }
  .main-title {
    font-size: 90px;
    font-weight: 900;
    line-height: 1.18;
    color: #fff;
    letter-spacing: 2px;
    text-shadow: 0 4px 30px rgba(0,229,160,0.35);
  }
  .main-title .hl {
    color: #00e5a0;
  }
  .sub-title {
    font-size: 40px;
    font-weight: 700;
    color: #ffd166;
    letter-spacing: 1px;
  }
  .deco-line {
    width: 80px;
    height: 5px;
    background: linear-gradient(90deg, #00e5a0, #ffd166);
    border-radius: 3px;
    margin-top: 10px;
  }
  .step-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 6px;
  }
  .step-chip {
    font-size: 22px;
    font-weight: 700;
    color: #d8f5ec;
    background: rgba(0,229,160,0.12);
    border: 1.5px solid rgba(0,229,160,0.45);
    border-radius: 8px;
    padding: 5px 14px;
    letter-spacing: 1px;
  }
  .step-chip.hit {
    background: rgba(0,229,160,0.18);
    border-color: rgba(0,229,160,0.7);
  }
  .step-chip.miss {
    background: rgba(255,209,102,0.12);
    border-color: rgba(255,209,102,0.5);
    color: #ffe9b3;
  }
  .step-chip.bad {
    background: rgba(239,68,68,0.14);
    border-color: rgba(239,68,68,0.5);
    color: #fecaca;
  }
  .mini {
    display: flex;
    gap: 14px;
    margin-top: 22px;
  }
  .mini .box {
    flex: 1;
    border-radius: 10px;
    padding: 14px 16px;
  }
  .mini .box.good {
    background: rgba(0,229,160,0.13);
    border-left: 5px solid #00e5a0;
  }
  .mini .box.mid {
    background: rgba(148,163,184,0.12);
    border-left: 5px solid #94a3b8;
  }
  .mini .bt {
    font-size: 25px;
    font-weight: 800;
    letter-spacing: 1px;
  }
  .mini .box.good .bt { color: #00e5a0; }
  .mini .box.mid .bt { color: #cbd5e1; }
  .mini .bd {
    font-size: 21px;
    color: rgba(255,255,255,0.78);
    margin-top: 7px;
    line-height: 1.55;
    font-weight: 600;
  }
  .bottom-area {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  .bottom-left {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .keyword {
    font-size: 26px;
    color: rgba(255,255,255,0.6);
    font-weight: 600;
    letter-spacing: 3px;
  }
  .keyword span {
    color: #00e5a0;
  }
  .bottom-right {
    text-align: right;
  }
  .bottom-right .label {
    font-size: 22px;
    color: rgba(255,255,255,0.4);
    font-weight: 600;
  }
  /* 弯月装饰 */
  .moon {
    position: absolute;
    top: 104px;
    right: 52px;
    width: 96px;
    height: 96px;
    border-radius: 50%;
    box-shadow: inset -26px -10px 0 0 #ffd166;
    transform: rotate(-18deg);
    filter: drop-shadow(0 0 18px rgba(255,209,102,0.45));
  }
  .glow-dot {
    position: absolute;
    border-radius: 50%;
    filter: blur(40px);
    opacity: 0.18;
  }
  .glow-dot:nth-child(1) {
    width: 300px;
    height: 300px;
    background: #00e5a0;
    top: -60px;
    right: -60px;
  }
  .glow-dot:nth-child(2) {
    width: 220px;
    height: 220px;
    background: #ffd166;
    bottom: 90px;
    left: -40px;
  }
</style>
</head>
<body>
  <div class="cover">
    <div class="glow-dot"></div>
    <div class="glow-dot"></div>
    <div class="moon"></div>

    <div class="tag-bar">
      <span class="badge">练后恢复</span>
      <span class="num">认知篇 · 01</span>
    </div>

    <div class="title-area">
      <div class="main-title">
        练后恢复<br>
        <span class="hl">只有2件事有用</span>
      </div>
      <div class="deco-line"></div>
      <div class="sub-title">其余大多是安慰剂</div>
      <div class="step-chips">
        <span class="step-chip hit">睡够7小时</span>
        <span class="step-chip hit">蛋白质吃够</span>
        <span class="step-chip hit">练后2小时进食</span>
        <span class="step-chip miss">拉伸被高估</span>
        <span class="step-chip miss">按摩枪只是舒服</span>
        <span class="step-chip miss">冰浴别碰</span>
        <span class="step-chip bad">喝酒熬夜最伤</span>
      </div>

      <div class="mini">
        <div class="box good">
          <div class="bt">真正有效</div>
          <div class="bd">睡眠 7h+<br>蛋白质 1.6-2.2g/kg<br>练后 2 小时内进食</div>
        </div>
        <div class="box mid">
          <div class="bt">被高估</div>
          <div class="bd">静态拉伸<br>泡沫轴 / 按摩枪<br>冰浴</div>
        </div>
      </div>
    </div>

    <div class="bottom-area">
      <div class="bottom-left">
        <div class="keyword"><span>睡眠</span> · <span>蛋白质</span> · <span>总热量</span></div>
        <div class="keyword"><span>被高估</span> · <span>拖后腿</span> 逐条拆</div>
      </div>
      <div class="bottom-right">
        <div class="label">收藏避坑</div>
      </div>
    </div>
  </div>
</body>
</html>
