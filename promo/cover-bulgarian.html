<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>保加利亚分腿蹲封面</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1500px;
    height: 2000px;
    overflow: hidden;
    background: #0a0a0f;
  }
  .cover {
    width: 750px;
    height: 1000px;
    transform: scale(2);
    transform-origin: 0 0;
    background: linear-gradient(160deg, #070b14 0%, #0d1b2e 35%, #0f3460 65%, #155e75 100%);
    position: relative;
    overflow: hidden;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 60px 50px;
  }
  .tag-bar {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .tag-bar .badge {
    background: #00e5a0;
    color: #06251c;
    font-size: 24px;
    font-weight: 700;
    padding: 6px 16px;
    border-radius: 6px;
    letter-spacing: 2px;
  }
  .tag-bar .num {
    color: rgba(255,255,255,0.5);
    font-size: 22px;
    font-weight: 600;
  }
  .title-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 20px;
  }
  .main-title {
    font-size: 88px;
    font-weight: 900;
    line-height: 1.18;
    color: #fff;
    letter-spacing: 2px;
    text-shadow: 0 4px 30px rgba(0,229,160,0.35);
  }
  .main-title .hl {
    color: #00e5a0;
  }
  .deco-line {
    width: 80px;
    height: 5px;
    background: linear-gradient(90deg, #00e5a0, #ffd166);
    border-radius: 3px;
    margin-top: 10px;
  }
  .sub-title {
    font-size: 40px;
    font-weight: 700;
    color: #ffd166;
    letter-spacing: 1px;
  }
  .step-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 6px;
  }
  .step-chip {
    font-size: 22px;
    font-weight: 700;
    color: #d8f5ec;
    background: rgba(0,229,160,0.12);
    border: 1.5px solid rgba(0,229,160,0.45);
    border-radius: 8px;
    padding: 5px 14px;
    letter-spacing: 1px;
  }
  .step-chip.warn {
    background: rgba(255,209,102,0.12);
    border-color: rgba(255,209,102,0.5);
    color: #ffe9b3;
  }
  .mini {
    display: flex;
    gap: 14px;
    margin-top: 22px;
  }
  .mini .box {
    flex: 1;
    border-radius: 10px;
    padding: 14px 16px;
  }
  .mini .box.good {
    background: rgba(0,229,160,0.13);
    border-left: 5px solid #00e5a0;
  }
  .mini .box.bad {
    background: rgba(239,68,68,0.13);
    border-left: 5px solid #ef4444;
  }
  .mini .bt {
    font-size: 25px;
    font-weight: 800;
    letter-spacing: 1px;
  }
  .mini .box.good .bt { color: #00e5a0; }
  .mini .box.bad .bt { color: #fca5a5; }
  .mini .bd {
    font-size: 21px;
    color: rgba(255,255,255,0.78);
    margin-top: 7px;
    line-height: 1.55;
    font-weight: 600;
  }
  .bottom-area {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  .bottom-left {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .keyword {
    font-size: 26px;
    color: rgba(255,255,255,0.6);
    font-weight: 600;
    letter-spacing: 3px;
  }
  .keyword span {
    color: #00e5a0;
  }
  .bottom-right {
    text-align: right;
  }
  .bottom-right .label {
    font-size: 22px;
    color: rgba(255,255,255,0.4);
    font-weight: 600;
  }
  .moon {
    position: absolute;
    top: 104px;
    right: 52px;
    width: 96px;
    height: 96px;
    border-radius: 50%;
    box-shadow: inset -26px -10px 0 0 #ffd166;
    transform: rotate(-18deg);
    filter: drop-shadow(0 0 18px rgba(255,209,102,0.45));
  }
  .glow-dot {
    position: absolute;
    border-radius: 50%;
    filter: blur(40px);
    opacity: 0.18;
  }
  .glow-dot:nth-child(1) {
    width: 300px;
    height: 300px;
    background: #00e5a0;
    top: -60px;
    right: -60px;
  }
  .glow-dot:nth-child(2) {
    width: 220px;
    height: 220px;
    background: #ffd166;
    bottom: 90px;
    left: -40px;
  }
</style>
</head>
<body>
  <div class="cover">
    <div class="glow-dot"></div>
    <div class="glow-dot"></div>
    <div class="moon"></div>

    <div class="tag-bar">
      <span class="badge">动作拆解</span>
      <span class="num">No.02 · 保加利亚分腿蹲</span>
    </div>

    <div class="title-area">
      <div class="main-title">
        保加利亚分腿蹲<br>
        <span class="hl">一条腿顶两条腿</span>
      </div>
      <div class="deco-line"></div>
      <div class="sub-title">臀腿双修 · 顺手修正左右腿力量差</div>
      <div class="step-chips">
        <span class="step-chip">后脚别搭太高</span>
        <span class="step-chip">前脚站远一点</span>
        <span class="step-chip">脚背搭凳</span>
        <span class="step-chip">髋往后下沉</span>
        <span class="step-chip warn">前脚太近最伤膝</span>
      </div>

      <div class="mini">
        <div class="box good">
          <div class="bt">练对了</div>
          <div class="bd">前膝在脚踝上方<br>后膝朝地面走<br>前脚掌三点踩实</div>
        </div>
        <div class="box bad">
          <div class="bt">练废了</div>
          <div class="bd">前膝冲过脚尖<br>后腿蹬地帮忙<br>弯腰低头看地</div>
        </div>
      </div>
    </div>

    <div class="bottom-area">
      <div class="bottom-left">
        <div class="keyword"><span>后脚高度</span> · <span>前脚距离</span> · <span>躯干角度</span></div>
        <div class="keyword"><span>膝盖疼</span> · <span>没感觉</span> 根因逐条拆</div>
      </div>
      <div class="bottom-right">
        <div class="label">收藏照做</div>
      </div>
    </div>
  </div>

</body>
</html>
