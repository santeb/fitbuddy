<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FitBuddy 精灵战斗预览</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:#0F0F1A; color:#fff; min-height:100vh; }

.preview-header { text-align:center; padding:20px 16px 8px; }
.preview-header h1 { font-size:22px; font-weight:900; background:linear-gradient(90deg,#F97316,#EC4899,#7C3AED); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.preview-header p { font-size:13px; opacity:0.6; margin-top:4px; }

.scene-tabs { display:flex; gap:8px; padding:12px 16px; flex-wrap:wrap; justify-content:center; }
.scene-tab { padding:8px 16px; border-radius:16px; border:1.5px solid rgba(255,255,255,0.2); background:rgba(255,255,255,0.05); color:#fff; font-size:13px; font-weight:700; cursor:pointer; transition:all 0.2s; }
.scene-tab.active { background:linear-gradient(90deg,#6366F1,#7C3AED); border-color:transparent; }
.scene-tab:active { transform:scale(0.95); }

.preview-stage { max-width:420px; margin:0 auto; padding:0 16px 40px; }

/* ===== 动画定义 ===== */
@keyframes petFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
@keyframes petEvo { 0%{transform:scale(1);filter:brightness(2)} 50%{transform:scale(1.1);filter:brightness(1.5)} 100%{transform:scale(1);filter:brightness(1)} }
@keyframes battleShake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-10px)} 50%{transform:translateX(10px)} 75%{transform:translateX(-6px)} }
@keyframes cbShake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }
@keyframes catchShake { 0%,100%{transform:translateX(0) rotate(0)} 15%{transform:translateX(-10px) rotate(-8deg)} 30%{transform:translateX(10px) rotate(8deg)} 45%{transform:translateX(-6px) rotate(-4deg)} 60%{transform:translateX(6px) rotate(4deg)} 75%{transform:translateX(-2px)} }
@keyframes catchSuccess { 0%{transform:scale(1)} 50%{transform:scale(1.2)} 100%{transform:scale(1)} }
@keyframes catchEscape { 0%{transform:translateY(0);opacity:1} 30%{transform:translateY(-20px);opacity:0.5} 100%{transform:translateY(-60px);opacity:0} }
@keyframes sparkle { 0%,100%{opacity:0;transform:scale(0)} 50%{opacity:1;transform:scale(1)} }
@keyframes glowPulse { 0%,100%{filter:drop-shadow(0 0 8px currentColor)} 50%{filter:drop-shadow(0 0 20px currentColor)} }
@keyframes slideUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
@keyframes flash { 0%,100%{opacity:0} 50%{opacity:0.8} }

.float { animation:petFloat 3s ease-in-out infinite; }
.evo-anim { animation:petEvo 0.6s ease-out; }
.cb-shake { animation:cbShake 0.3s ease-in-out; }
.catch-shaking { animation:catchShake 0.8s ease-in-out; }
.catch-success { animation:catchSuccess 0.4s ease-out; }
.catch-escaped { animation:catchEscape 0.6s ease-in forwards; }
.catch-ball { font-size:54px; display:inline-block; transition:all 0.3s; }

/* ===== 战斗弹窗 ===== */
.battle-overlay { background:linear-gradient(135deg,#1A1A2E,#16213E,#0F3460); border:3px solid #6EE7B7; border-radius:20px; padding:20px; text-align:center; animation:petEvo 0.3s ease-out; }
.battle-overlay.companion { border-color:#818CF8; }
.battle-vs { display:flex; align-items:center; justify-content:center; gap:10px; margin:8px 0; }
.battle-fighter { text-align:center; }
.battle-fighter .emoji { font-size:52px; transition:transform 0.3s; }
.battle-fighter .emoji.wild { font-size:44px; }
.battle-vs-text { font-size:24px; font-weight:900; opacity:0.6; }
.hp-bar-bg { margin-top:4px; background:rgba(255,255,255,0.1); border-radius:8px; height:8px; overflow:hidden; }
.hp-bar-fill { height:100%; border-radius:8px; transition:width 0.6s; }
.hp-bar-fill.my { background:linear-gradient(90deg,#22C55E,#16A34A); }
.hp-bar-fill.en { background:linear-gradient(90deg,#EF4444,#DC2626); }
.hp-label { font-size:10px; opacity:0.7; margin-top:2px; }

.battle-log { background:rgba(255,255,255,0.08); border-radius:12px; padding:10px; margin:8px 0; min-height:36px; font-size:12px; opacity:0.85; text-align:center; line-height:1.6; }
.battle-result { font-size:18px; font-weight:900; margin:8px 0; }
.battle-actions { margin-top:10px; }
.battle-btn { padding:10px 28px; border-radius:16px; font-size:14px; font-weight:700; cursor:pointer; border:none; margin:4px; }
.battle-btn-catch { background:linear-gradient(90deg,#F59E0B,#F97316); color:#fff; }
.battle-btn-release { background:rgba(255,255,255,0.15); color:#fff; border:1.5px solid rgba(255,255,255,0.3); }
.battle-btn-ok { background:rgba(255,255,255,0.15); color:#fff; border:1.5px solid rgba(255,255,255,0.3); }
.battle-btn-share { background:linear-gradient(90deg,#EC4899,#DB2777); color:#fff; }

/* ===== 遭遇弹窗 ===== */
.encounter-overlay { background:linear-gradient(135deg,#1A1A2E,#16213E); border:3px solid #F59E0B; border-radius:20px; padding:24px 20px; text-align:center; animation:petEvo 0.3s ease-out; }
.encounter-emoji { font-size:72px; animation:petFloat 2s ease-in-out infinite; }
.encounter-name { font-size:20px; font-weight:900; margin:8px 0 4px; }
.encounter-info { font-size:12px; opacity:0.7; margin-bottom:12px; }
.encounter-btns { display:flex; gap:10px; justify-content:center; }
.encounter-btn { padding:12px 24px; border-radius:20px; font-size:15px; font-weight:700; cursor:pointer; border:none; }
.encounter-btn-fight { background:linear-gradient(90deg,#EF4444,#DC2626); color:#fff; }
.encounter-btn-flee { background:rgba(255,255,255,0.15); color:#fff; border:1.5px solid rgba(255,255,255,0.3); }

/* ===== 元素标签 ===== */
.elem-badge { display:inline-block; padding:2px 8px; border-radius:8px; font-size:11px; font-weight:700; }
.elem-fire { background:rgba(249,115,22,0.2); color:#FB923C; }
.elem-ice { background:rgba(14,165,233,0.2); color:#38BDF8; }
.elem-thunder { background:rgba(234,179,8,0.2); color:#FACC15; }
.elem-nature { background:rgba(34,197,94,0.2); color:#4ADE80; }
.elem-water { background:rgba(6,182,212,0.2); color:#22D3EE; }
.elem-rock { background:rgba(168,162,158,0.2); color:#D6D3D1; }
.elem-dark { background:rgba(124,58,237,0.2); color:#A78BFA; }
.elem-light { background:rgba(236,72,153,0.2); color:#F472B6; }

/* ===== 精灵展示 ===== */
.pet-showcase { display:grid; grid-template-columns:repeat(auto-fit,minmax(100px,1fr)); gap:10px; padding:12px 0; }
.pet-card-mini { background:rgba(255,255,255,0.05); border-radius:14px; padding:12px 8px; text-align:center; border:1px solid rgba(255,255,255,0.1); transition:all 0.2s; }
.pet-card-mini:hover { transform:translateY(-4px); border-color:rgba(255,255,255,0.3); }
.pet-card-mini .emoji { font-size:36px; }
.pet-card-mini .name { font-size:11px; font-weight:700; margin-top:4px; }
.pet-card-mini .stage { font-size:9px; opacity:0.6; }

/* ===== 进化展示 ===== */
.evo-row { display:flex; align-items:center; justify-content:center; gap:8px; padding:16px 0; flex-wrap:wrap; }
.evo-step { text-align:center; }
.evo-step .emoji { font-size:40px; }
.evo-step .label { font-size:10px; opacity:0.7; margin-top:2px; }
.evo-arrow { font-size:16px; opacity:0.4; }

.sparkle { position:absolute; font-size:20px; animation:sparkle 1.5s ease-in-out infinite; }

/* ===== 进化剧场 ===== */
@keyframes evoGlowBuild { 0%{filter:brightness(1) drop-shadow(0 0 0 transparent);transform:scale(1)} 100%{filter:brightness(3) drop-shadow(0 0 30px var(--glow));transform:scale(1.15)} }
@keyframes evoFlash { 0%{opacity:0} 30%{opacity:1} 100%{opacity:0} }
@keyframes evoMorph { 0%{transform:scale(0.3);opacity:0;filter:blur(10px)} 50%{transform:scale(1.3);opacity:0.5;filter:blur(5px)} 100%{transform:scale(1);opacity:1;filter:blur(0)} }
@keyframes evoRing { 0%{width:0;height:0;opacity:0.8;border-width:4px} 100%{width:300px;height:300px;opacity:0;border-width:1px} }
@keyframes particleBurst { 0%{transform:translate(0,0) scale(1);opacity:1} 100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0} }
@keyframes evoRay { 0%{transform:rotate(0deg) scaleY(0);opacity:0} 30%{opacity:0.6} 100%{transform:rotate(360deg) scaleY(1);opacity:0} }
@keyframes floatUp { 0%{transform:translateY(0);opacity:0} 20%{opacity:1} 100%{transform:translateY(-80px);opacity:0} }

.evo-theater { position:relative; border-radius:20px; overflow:hidden; min-height:320px; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.evo-stage-area { position:relative; width:100%; height:220px; display:flex; align-items:center; justify-content:center; }
.evo-pet { font-size:80px; z-index:3; transition:all 0.3s; position:relative; }
.evo-pet.evolving { animation:evoGlowBuild 1.2s ease-in forwards; }
.evo-pet.morphed { animation:evoMorph 0.6s ease-out; }
.evo-ring { position:absolute; border-radius:50%; border:4px solid var(--ring-color); z-index:2; pointer-events:none; animation:evoRing 1s ease-out; }
.evo-ray { position:absolute; width:200%; height:200%; left:-50%; top:-50%; z-index:1; pointer-events:none; }
.evo-flash { position:absolute; top:0; left:0; width:100%; height:100%; background:#fff; z-index:5; pointer-events:none; animation:evoFlash 0.4s ease-out; }
.evo-particle { position:absolute; font-size:18px; z-index:4; pointer-events:none; animation:particleBurst 1s ease-out forwards; }
.evo-bubble { position:absolute; bottom:20px; font-size:16px; z-index:4; pointer-events:none; animation:floatUp 1.5s ease-out forwards; }

.evo-info-card { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); border-radius:14px; padding:12px 16px; margin:8px 16px; text-align:center; width:calc(100% - 32px); }
.evo-stage-name { font-size:16px; font-weight:900; }
.evo-stage-desc { font-size:12px; opacity:0.7; margin-top:4px; line-height:1.5; }
.evo-progress { margin-top:10px; height:6px; background:rgba(255,255,255,0.1); border-radius:4px; overflow:hidden; }
.evo-progress-fill { height:100%; border-radius:4px; transition:width 0.5s ease; }
.evo-progress-text { font-size:10px; opacity:0.6; margin-top:4px; }

.evo-pet-selector { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; padding:12px 0; }
.evo-pet-btn { width:48px; height:48px; border-radius:14px; background:rgba(255,255,255,0.05); border:2px solid transparent; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:26px; transition:all 0.2s; }
.evo-pet-btn:hover { transform:scale(1.1); background:rgba(255,255,255,0.1); }
.evo-pet-btn.active { border-color:var(--btn-glow,#6366F1); background:rgba(99,102,241,0.15); transform:scale(1.1); }
.evo-pet-btn.locked { opacity:0.4; }

.evo-chain-mini { display:flex; align-items:center; justify-content:center; gap:2px; margin-top:10px; flex-wrap:wrap; }
.evo-chain-step { text-align:center; padding:3px 6px; border-radius:8px; transition:all 0.3s; }
.evo-chain-step.current { background:rgba(255,255,255,0.1); transform:scale(1.15); }
.evo-chain-step.done { opacity:0.4; }
.evo-chain-step .ce { font-size:22px; }
.evo-chain-step .cl { font-size:8px; opacity:0.7; }
.evo-chain-arrow { font-size:10px; opacity:0.3; }

.section-title { font-size:14px; font-weight:700; opacity:0.8; margin:20px 0 8px; padding-left:4px; border-left:3px solid #6366F1; padding-left:10px; }

.replay-btn { display:block; margin:16px auto; padding:10px 32px; border-radius:20px; background:linear-gradient(90deg,#6366F1,#7C3AED); color:#fff; border:none; font-size:14px; font-weight:700; cursor:pointer; }
.replay-btn:active { transform:scale(0.95); }

/* ===== 手动战斗 ===== */
@keyframes dmgFloat { 0%{opacity:1;transform:translateY(0) scale(1)} 100%{opacity:0;transform:translateY(-50px) scale(1.3)} }
@keyframes skillFlash { 0%{opacity:0} 20%{opacity:0.3} 100%{opacity:0} }
@keyframes hpDrain { 0%{width:var(--old-w)} 100%{width:var(--new-w)} }
@keyframes enemyHit { 0%,100%{transform:translateX(0)} 30%{transform:translateX(-8px)} 60%{transform:translateX(8px)} }
@keyframes playerHit { 0%,100%{transform:translateX(0)} 30%{transform:translateX(6px)} 60%{transform:translateX(-6px)} }
@keyframes critPulse { 0%{transform:scale(1)} 20%{transform:scale(1.4)} 100%{transform:scale(1)} }

.dmg-num { position:absolute; font-weight:900; font-size:22px; pointer-events:none; z-index:20; animation:dmgFloat 1s ease-out forwards; text-shadow:0 2px 8px rgba(0,0,0,0.5); }
.dmg-num.crit { font-size:30px; animation:dmgFloat 1.2s ease-out forwards, critPulse 0.3s ease-out; }
.dmg-num.heal { color:#4ADE80 !important; }
.dmg-num.weak { font-size:16px; opacity:0.8; }

.skill-flash { position:absolute; top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:15;animation:skillFlash 0.5s ease-out; }
.skill-flash.enemy { background:rgba(255,0,0,0.3); }

.battle-stage { position:relative; background:rgba(255,255,255,0.03); border-radius:18px; padding:16px; min-height:360px; display:flex; flex-direction:column; gap:12px; border:1px solid rgba(255,255,255,0.08); }

.enemy-area { display:flex; align-items:center; gap:12px; background:rgba(0,0,0,0.2); border-radius:14px; padding:12px; }
.enemy-sprite { font-size:60px; transition:transform 0.3s; flex-shrink:0; }
.enemy-sprite.hit { animation:enemyHit 0.4s ease-out; }
.enemy-info { flex:1; min-width:0; }
.enemy-name-row { display:flex; align-items:center; gap:6px; margin-bottom:6px; }
.enemy-lv { font-size:10px; padding:2px 6px; background:rgba(255,255,255,0.1); border-radius:6px; }
.hp-bar-outer { height:10px; background:rgba(255,255,255,0.08); border-radius:6px; overflow:hidden; }
.hp-bar-inner { height:100%; border-radius:6px; transition:width 0.6s ease; }
.hp-bar-inner.high { background:linear-gradient(90deg,#22C55E,#4ADE80); }
.hp-bar-inner.mid { background:linear-gradient(90deg,#EAB308,#FACC15); }
.hp-bar-inner.low { background:linear-gradient(90deg,#EF4444,#F97316); }
.hp-text { font-size:10px; opacity:0.6; margin-top:2px; }

.battle-log-area { flex:1; position:relative; background:rgba(0,0,0,0.15); border-radius:12px; padding:10px 12px; min-height:80px; max-height:120px; overflow-y:auto; font-size:12px; line-height:1.8; display:flex; flex-direction:column-reverse; }
.battle-log-msg { opacity:0.8; }
.battle-log-msg.skill-use { color:#FACC15; font-weight:700; }
.battle-log-msg.effective { color:#22C55E; }
.battle-log-msg.resisted { color:#F97316; }
.battle-log-msg.stun { color:#7C3AED; }

.player-area { display:flex; align-items:center; gap:12px; background:rgba(0,0,0,0.2); border-radius:14px; padding:12px; }
.player-sprite { font-size:60px; transition:transform 0.3s; flex-shrink:0; }
.player-sprite.hit { animation:playerHit 0.4s ease-out; }
.player-info { flex:1; min-width:0; }

.skill-bar { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding:4px 0; }
.skill-btn { background:rgba(255,255,255,0.06); border:1.5px solid rgba(255,255,255,0.12); border-radius:14px; padding:10px 8px; color:#fff; cursor:pointer; text-align:center; transition:all 0.2s; font-family:inherit; }
.skill-btn:hover:not(:disabled) { background:rgba(255,255,255,0.12); transform:translateY(-2px); border-color:rgba(255,255,255,0.3); }
.skill-btn:disabled { opacity:0.35; cursor:not-allowed; }
.skill-btn .sk-icon { font-size:20px; display:block; }
.skill-btn .sk-name { font-size:13px; font-weight:800; margin:4px 0 2px; }
.skill-btn .sk-meta { font-size:10px; opacity:0.5; }
.skill-btn.on-cd { border-color:rgba(239,68,68,0.3); }
.skill-btn.on-cd .sk-cd { color:#EF4444; font-weight:700; }

.skill-tip { font-size:10px; opacity:0.4; text-align:center; margin-top:4px; }

.result-overlay { position:absolute; top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7); display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30;border-radius:18px; }
.result-overlay.win { background:rgba(34,197,94,0.15); }
.result-overlay.lose { background:rgba(239,68,68,0.12); }
.result-title { font-size:26px; font-weight:900; margin-bottom:8px; }
.result-sub { font-size:14px; opacity:0.8; margin-bottom:16px; }

.pet-select-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
.pet-select-card { background:rgba(255,255,255,0.05); border:2px solid rgba(255,255,255,0.1); border-radius:16px; padding:14px 8px; text-align:center; cursor:pointer; transition:all 0.2s; }
.pet-select-card:hover { transform:translateY(-4px); border-color:rgba(255,255,255,0.3); background:rgba(255,255,255,0.08); }
.pet-select-card .ps-emoji { font-size:40px; }
.pet-select-card .ps-name { font-size:12px; font-weight:700; margin:6px 0 2px; }
.pet-select-card .ps-elem { font-size:10px; opacity:0.6; }
</style>
</head>
<body>

<div class="preview-header">
  <h1>🐉 FitBuddy 精灵战斗预览</h1>
  <p>选择场景，查看动画特效</p>
</div>

<div class="scene-tabs">
  <div class="scene-tab active" onclick="switchScene('wild')">🌿 野外遭遇战</div>
  <div class="scene-tab" onclick="switchScene('catch')">🎯 捕捉动画</div>
  <div class="scene-tab" onclick="switchScene('companion')">⚔️ 同伴切磋</div>
  <div class="scene-tab" onclick="switchScene('encounter')">👀 遭遇弹窗</div>
  <div class="scene-tab" onclick="switchScene('evolution')">✨ 进化动画</div>
  <div class="scene-tab" onclick="switchScene('showcase')">📖 全精灵图鉴</div>
  <div class="scene-tab" onclick="switchScene('manual')">🎮 手动对战</div>
  <div class="scene-tab" onclick="switchScene('3d')">🌌 3D对战</div>
</div>

<div class="preview-stage" id="stage"></div>

<script>
// ===== 数据 =====
var TYPE_CHART = {
  fire:    { strong:'nature', weak:'ice',      emoji:'🔥', color:'#F97316', label:'火' },
  ice:     { strong:'fire',    weak:'thunder',  emoji:'❄️', color:'#0EA5E9', label:'冰' },
  thunder: { strong:'ice',     weak:'nature',   emoji:'⚡', color:'#EAB308', label:'雷' },
  nature:  { strong:'thunder', weak:'fire',     emoji:'🌿', color:'#22C55E', label:'草' },
  light:   { strong:null,      weak:null,       emoji:'🌈', color:'#EC4899', label:'光' },
  water:   { strong:'fire',    weak:'thunder',  emoji:'🌊', color:'#06B6D4', label:'水' },
  rock:    { strong:'thunder', weak:'nature',   emoji:'⛰️', color:'#A8A29E', label:'岩' },
  dark:    { strong:'nature',  weak:'fire',     emoji:'🦇', color:'#7C3AED', label:'暗' }
};

var PETS = [
  { id:'fireDragon', name:'🔥 火焰龙', element:'fire', rarity:'普通', stages:[{e:'🥚',n:'龙蛋'},{e:'🐣',n:'雏龙'},{e:'🐤',n:'炎雀'},{e:'🦅',n:'烈鹰'},{e:'🐉',n:'炎龙王'}] },
  { id:'frostWolf', name:'❄️ 冰霜狼', element:'ice', rarity:'普通', stages:[{e:'🥚',n:'冰卵'},{e:'🐾',n:'霜爪'},{e:'🦊',n:'冰狐'},{e:'🐺',n:'霜狼'},{e:'🐺',n:'冰皇狼'}] },
  { id:'thunderTiger', name:'⚡ 雷霆虎', element:'thunder', rarity:'稀有', stages:[{e:'🥚',n:'雷卵'},{e:'🐱',n:'电猫'},{e:'😼',n:'雷豹'},{e:'🐯',n:'雷霆虎'},{e:'🐯',n:'雷皇虎'}] },
  { id:'jadeDeer', name:'🌿 翡翠鹿', element:'nature', rarity:'史诗', stages:[{e:'🥚',n:'翠卵'},{e:'🐇',n:'翠兔'},{e:'🦌',n:'翠鹿'},{e:'🦌',n:'翡翠鹿'},{e:'🦌',n:'生命古鹿'}] },
  { id:'phantomUnicorn', name:'🦄 幻光独角兽', element:'light', rarity:'隐藏', stages:[{e:'🥚',n:'光之卵'},{e:'⭐',n:'星光'},{e:'🦋',n:'幻蝶'},{e:'🌈',n:'彩虹驹'},{e:'🦄',n:'圣独角兽'}] },
  { id:'abyssalJellyfish', name:'🌊 深渊水母', element:'water', rarity:'稀有', stages:[{e:'🥚',n:'水卵'},{e:'💧',n:'水泡'},{e:'🪼',n:'幼体'},{e:'🪼',n:'潮汐使'},{e:'🪼',n:'深渊之主'}] },

function elemBadge(el) {
  var t = TYPE_CHART[el];
  return '<span class="elem-badge elem-'+el+'">'+t.emoji+' '+t.label+'</span>';
}

function getTypeAdvantage(myEl, enEl) {
  if (myEl === 'light' || enEl === 'light') return 1.0;
  var myType = TYPE_CHART[myEl];
  if (myType.strong === enEl) return 1.4;
  if (myType.weak === enEl) return 0.6;
  return 1.0;
}

// ===== 场景切换 =====
function switchScene(name) {
  document.querySelectorAll('.scene-tab').forEach(function(t){ t.classList.remove('active'); });
  event.target.classList.add('active');
  var stage = document.getElementById('stage');
  stage.innerHTML = '';
  if (name === 'wild') renderWildBattle();
  else if (name === 'catch') renderCatchScene();
  else if (name === 'companion') renderCompanionBattle();
  else if (name === 'encounter') renderEncounter();
  else if (name === 'evolution') renderEvolution();
  else if (name === 'showcase') renderShowcase();
  else if (name === 'manual') renderManualBattle();
  else if (name === '3d') render3DBattle();
}

// ===== 场景1: 野外遭遇战 =====
function renderWildBattle() {
  var stage = document.getElementById('stage');
  var myPet = PETS[0]; // 火焰龙 stage 3
  var wildPet = PETS[4]; // 幻光独角兽
  var myEl = TYPE_CHART[myPet.element];
  var enEl = TYPE_CHART[wildPet.element];
  var adv = getTypeAdvantage(myPet.element, wildPet.element);
  var advNote = adv > 1 ? '(克制对方！🔥)' : adv < 1 ? '(被对方克制…💔)' : '(无克制关系)';
  var myAtk = 42, myHp = 180;
  var enAtk = 35, enHp = 150;

  var html = '<div class="section-title">⚡ 野外精灵战斗 — 3回合自动对战</div>';
  html += '<div class="battle-overlay" id="wildBattle">';
  html += '<div style="font-size:11px;opacity:0.7;letter-spacing:1px;margin-bottom:4px;">🌿 遭遇了野生精灵！</div>';
  html += '<div style="font-size:20px;font-weight:900;margin-bottom:2px;">'+myPet.name+' VS 野生'+wildPet.name+'</div>';
  html += '<div style="font-size:11px;opacity:0.7;margin-bottom:6px;">'+advNote+'</div>';
  html += '<div class="battle-vs">';
  html += '<div class="battle-fighter"><div class="emoji wild float" id="myEmoji">'+myPet.stages[3].e+'</div><div style="font-size:11px;font-weight:700;">'+myPet.name+'</div><div style="font-size:10px;opacity:0.7;">'+elemBadge(myPet.element)+' ATK:'+myAtk+'</div><div class="hp-bar-bg" style="width:80px;margin-left:auto;margin-right:auto;"><div class="hp-bar-fill my" id="myHP" style="width:100%"></div></div><div class="hp-label" id="myHPLabel">HP:'+myHp+'/'+myHp+'</div></div>';
  html += '<div class="battle-vs-text">⚡VS⚡</div>';
  html += '<div class="battle-fighter"><div class="emoji wild float" id="enEmoji" style="animation-delay:0.5s">'+wildPet.stages[2].e+'</div><div style="font-size:11px;font-weight:700;">野生'+wildPet.name+'</div><div style="font-size:10px;opacity:0.7;">'+elemBadge(wildPet.element)+' ATK:'+enAtk+'</div><div class="hp-bar-bg" style="width:80px;margin-left:auto;margin-right:auto;"><div class="hp-bar-fill en" id="enHP" style="width:100%"></div></div><div class="hp-label" id="enHPLabel">HP:'+enHp+'/'+enHp+'</div></div>';
  html += '</div>';
  html += '<div class="battle-log" id="battleLog">⏳ 战斗即将开始…</div>';
  html += '<div class="battle-result" id="battleResult" style="display:none;"></div>';
  html += '<div class="battle-actions" id="battleActions" style="display:none;"></div>';
  html += '</div>';
  html += '<button class="replay-btn" onclick="renderWildBattle()">🔄 再来一局</button>';

  stage.innerHTML = html;
  ensureShakeStyle();

  // 战斗逻辑
  var myHP = myHp, enHP = enHp;
  var log = [];
  var logEl = document.getElementById('battleLog');
  var round = 0;

  function doRound(n) {
    if (n > 3 || myHP <= 0 || enHP <= 0) { finish(); return; }
    var myDmg = Math.floor((myAtk + Math.floor(Math.random()*9)-4) * adv);
    var enDmg = Math.floor((enAtk + Math.floor(Math.random()*9)-4) / adv);
    if (myDmg < 1) myDmg = 1;
    if (enDmg < 1) enDmg = 1;
    enHP -= myDmg; myHP -= enDmg;
    if (enHP < 0) enHP = 0;
    if (myHP < 0) myHP = 0;

    log.push('第'+n+'回合：你对野生'+wildPet.name+'造成 '+myDmg+' 伤，受到 '+enDmg+' 伤');
    logEl.innerHTML = log.join('<br>');

    // 震动
    shakeEmoji('myEmoji'); shakeEmoji('enEmoji');
    // 更新血条
    updateHP('myHP', 'myHPLabel', myHP, myHp);
    updateHP('enHP', 'enHPLabel', enHP, enHp);

    setTimeout(function(){ doRound(n+1); }, 1100);
  }

  function finish() {
    var myWin = enHP <= 0 && myHP > 0;
    var draw = (myHP <= 0 && enHP <= 0);
    var r = document.getElementById('battleResult');
    var a = document.getElementById('battleActions');
    r.style.display = 'block';
    a.style.display = 'block';
    if (myWin) {
      r.innerHTML = '🎉 你打败了野生'+wildPet.name+'！';
      r.style.color = '#22C55E';
      a.innerHTML = '<button class="battle-btn battle-btn-catch" onclick="renderCatchScene()">🎯 捕捉它！</button><button class="battle-btn battle-btn-release" onclick="renderWildBattle()">😢 放生</button>';
    } else if (draw) {
      r.innerHTML = '🤝 平局！野生精灵趁机逃走了…';
      r.style.color = '#F59E0B';
      a.innerHTML = '<button class="battle-btn battle-btn-ok" onclick="renderWildBattle()">👌 知道了</button>';
    } else {
      r.innerHTML = '💔 你被野生'+wildPet.name+'打败了…';
      r.style.color = '#EF4444';
      a.innerHTML = '<button class="battle-btn battle-btn-ok" onclick="renderWildBattle()">😢 继续训练</button>';
    }
  }

  setTimeout(function(){ doRound(1); }, 800);
}

function shakeEmoji(id) {
  var el = document.getElementById(id);
  if (!el) return;
  el.style.animation = 'none';
  void el.offsetWidth;
  el.style.animation = 'battleShake 0.25s ease-in-out, petFloat 3s ease-in-out infinite 0.3s';
}

function updateHP(barId, labelId, cur, max) {
  var bar = document.getElementById(barId);
  var label = document.getElementById(labelId);
  if (bar) bar.style.width = Math.max(2, cur/max*100) + '%';
  if (label) label.textContent = 'HP:'+cur+'/'+max;
}

function selectEvoPet(idx) {
  if (_evoState.evolving) return;
  _evoState.petIdx = idx;
  _evoState.stage = 0;
  updateEvoDisplay();
}

function updateEvoDisplay() {
  var pet = PETS[_evoState.petIdx];
  var th = EVO_THEATER[pet.id];
  var s = _evoState.stage;

  // 更新选择器高亮
  document.querySelectorAll('.evo-pet-btn').forEach(function(b, i) {
    b.classList.toggle('active', i === _evoState.petIdx);
  });

  // 更新剧场背景
  var theater = document.getElementById('evoTheater');
  theater.style.background = 'radial-gradient(ellipse at center, '+th.color+'22 0%, #0F0F1A 70%)';
  theater.style.setProperty('--glow', th.glow);
  theater.style.setProperty('--ring-color', th.color);

  // 更新精灵
  var petEl = document.getElementById('evoPet');
  petEl.textContent = pet.stages[s].e;
  petEl.style.animation = 'none';
  void petEl.offsetWidth;
  petEl.style.animation = 'petFloat 3s ease-in-out infinite';

  // 更新信息卡
  document.getElementById('evoStageName').textContent = pet.stages[s].n + ' · ' + pet.name;
  document.getElementById('evoStageName').style.color = th.color;
  document.getElementById('evoStageDesc').textContent = th.desc[s];

  // 进度条
  var needs = [0, 3, 10, 25, 50];
  var curNeed = needs[s];
  var nextNeed = s < 4 ? needs[s+1] : needs[s];
  var progress = s >= 4 ? 100 : Math.round(curNeed / nextNeed * 100);
  var fill = document.getElementById('evoProgressFill');
  fill.style.width = progress + '%';
  fill.style.background = 'linear-gradient(90deg,'+th.color+','+th.glow+')';

  var daysText = s >= 4 ? '训练 ' + curNeed + ' 天 · 最终形态！' : '训练 ' + curNeed + ' 天 · 距离下一阶段 ' + (nextNeed - curNeed) + ' 天';
  document.getElementById('evoProgressText').textContent = daysText;

  // 更新迷你进化链
  pet.stages.forEach(function(st, i) {
    var el = document.getElementById('chainStep'+i);
    if (el) {
      el.className = 'evo-chain-step' + (i === s ? ' current' : (i < s ? ' done' : ''));
    }
  });

  // 更新按钮文案
  var btn = document.getElementById('evoBtn');
  if (s >= 4) {
    btn.textContent = '🏆 已达最终形态';
    btn.style.opacity = '0.5';
    btn.style.pointerEvents = 'none';
  } else {
    btn.textContent = '✨ 进化到 ' + pet.stages[s+1].n;
    btn.style.opacity = '1';
    btn.style.pointerEvents = 'auto';
  }
}

function triggerEvolution() {
  if (_evoState.evolving) return;
  if (_evoState.stage >= 4) return;

  _evoState.evolving = true;
  var pet = PETS[_evoState.petIdx];
  var th = EVO_THEATER[pet.id];
  var theater = document.getElementById('evoTheater');
  var stageArea = document.getElementById('evoStageArea');
  var petEl = document.getElementById('evoPet');
  var btn = document.getElementById('evoBtn');
  btn.style.opacity = '0.5';
  btn.style.pointerEvents = 'none';

  // 第1阶段：光芒蓄力（1.2秒）
  petEl.classList.add('evolving');
  petEl.classList.remove('float');

  // 添加光圈
  var ring = document.createElement('div');
  ring.className = 'evo-ring';
  ring.style.setProperty('--ring-color', th.color);
  stageArea.appendChild(ring);

  // 添加光线旋转
  var ray = document.createElement('div');
  ray.className = 'evo-ray';
  ray.style.background = 'conic-gradient(from 0deg, transparent 0%, '+th.color+'33 25%, transparent 50%, '+th.glow+'33 75%, transparent 100%)';
  ray.style.animation = 'evoRay 1.2s ease-out';
  stageArea.appendChild(ray);

  // 蓄力粒子（从外向内）
  for (var i = 0; i < 8; i++) {
    (function(idx) {
      setTimeout(function() {
        var p = document.createElement('div');
        p.className = 'evo-particle';
        p.textContent = th.sparkles[Math.floor(Math.random()*th.sparkles.length)];
        var angle = (idx / 8) * Math.PI * 2;
        var dist = 80;
        p.style.left = 'calc(50% + '+(Math.cos(angle)*dist)+'px)';
        p.style.top = 'calc(50% + '+(Math.sin(angle)*dist)+'px)';
        p.style.setProperty('--dx', (-Math.cos(angle)*dist)+'px');
        p.style.setProperty('--dy', (-Math.sin(angle)*dist)+'px');
        p.style.animation = 'particleBurst 0.6s ease-out forwards reverse';
        stageArea.appendChild(p);
        setTimeout(function(){ p.remove(); }, 600);
      }, idx * 100);
    })(i);
  }

  // 第2阶段：白光爆发（1.2秒后）
  setTimeout(function() {
    var flash = document.createElement('div');
    flash.className = 'evo-flash';
    theater.appendChild(flash);
    setTimeout(function(){ flash.remove(); }, 400);

    // 切换精灵形态
    _evoState.stage++;
    petEl.textContent = pet.stages[_evoState.stage].e;
    petEl.classList.remove('evolving');
    petEl.classList.add('morphed');
    setTimeout(function(){ petEl.classList.remove('morphed'); petEl.classList.add('float'); }, 600);

    // 第3阶段：粒子爆发
    var burstCount = 20;
    for (var j = 0; j < burstCount; j++) {
      (function(idx) {
        setTimeout(function() {
          var p = document.createElement('div');
          p.className = 'evo-particle';
          p.textContent = th.sparkles[Math.floor(Math.random()*th.sparkles.length)];
          p.style.fontSize = (12 + Math.random()*20) + 'px';
          p.style.left = '50%';
          p.style.top = '50%';
          var angle = (idx / burstCount) * Math.PI * 2 + Math.random() * 0.3;
          var dist = 60 + Math.random() * 80;
          p.style.setProperty('--dx', (Math.cos(angle)*dist)+'px');
          p.style.setProperty('--dy', (Math.sin(angle)*dist)+'px');
          p.style.animation = 'particleBurst ' + (0.8 + Math.random()*0.4) + 's ease-out forwards';
          stageArea.appendChild(p);
          setTimeout(function(){ p.remove(); }, 1200);
        }, idx * 30);
      })(j);
    }

    // 上浮气泡
    for (var k = 0; k < 6; k++) {
      (function(idx) {
        setTimeout(function() {
          var b = document.createElement('div');
          b.className = 'evo-bubble';
          b.textContent = th.sparkles[Math.floor(Math.random()*th.sparkles.length)];
          b.style.left = (20 + Math.random()*60) + '%';
          b.style.fontSize = (14 + Math.random()*12) + 'px';
          stageArea.appendChild(b);
          setTimeout(function(){ b.remove(); }, 1500);
        }, idx * 150);
      })(k);
    }

    // 更新信息卡
    setTimeout(function() {
      updateEvoDisplay();
      _evoState.evolving = false;
      if (_evoState.stage >= 4) {
        // 最终形态庆祝
        var celebrate = document.createElement('div');
        celebrate.style.cssText = 'position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:24px;font-weight:900;color:'+th.color+';z-index:10;animation:petEvo 0.5s ease-out;white-space:nowrap;text-shadow:0 0 20px '+th.glow+';';
        celebrate.textContent = '🏆 最终形态！';
        stageArea.appendChild(celebrate);
        setTimeout(function(){ celebrate.remove(); }, 2000);
      }
    }, 700);

  }, 1200);
}

function resetEvolution() {
  _evoState.stage = 0;
  _evoState.evolving = false;
  updateEvoDisplay();
}

function useSkill(idx) {
  var mb = _mb;
  if (!mb || mb.over || !mb.myTurn) return;
  var sk = mb.skills[idx];
  if (sk.curCd > 0) return;

  mb.myTurn = false;
  disableAllSkills(true);

  // 记录冷却
  sk.curCd = sk.cd + 1; // +1 因为本回合算消耗

  // 计算伤害
  var rawDmg = sk.dmg || 0;
  var heal = sk.heal || 0;
  var isHeal = heal > 0;
  var baseDmg = isHeal ? 0 : Math.floor(rawDmg * (0.85 + Math.random() * 0.3));
  var multi = mb.adv;
  var isCrit = Math.random() < 0.1;
  if (isCrit) multi *= 1.5;
  var finalDmg = Math.floor(baseDmg * multi);

  // 应用伤害
  if (isHeal) {
    mb.myHp = Math.min(mb.myMaxHp, mb.myHp + heal);
  } else {
    mb.enHp = Math.max(0, mb.enHp - finalDmg);
  }

  // 特效文字
  var dmgText = isHeal ? '+'+heal : '-'+finalDmg;
  var dmgColor = isHeal ? '#4ADE80' : (multi > 1.2 ? '#FACC15' : (multi < 0.8 ? '#F97316' : '#fff'));
  var dmgClass = '';
  if (isCrit && !isHeal) dmgClass = ' crit';
  if (multi < 0.8 && !isHeal) dmgClass += ' weak';

  // 动画
  if (isHeal) {
    showDmgNum('playerSprite', dmgText, '#4ADE80', 'heal');
    updateHpBars();
    addLog('💚 '+sk.emoji+' '+sk.name+' → 回复 '+heal+' HP！', 'skill-use');
  } else {
    // 敌人受击动画
    var enSprite = document.getElementById('enemySprite');
    if (enSprite) { enSprite.classList.remove('hit'); void enSprite.offsetWidth; enSprite.classList.add('hit'); }
    showDmgNum('enemySprite', dmgText, dmgColor, dmgClass);
    if (isCrit) addLog('💥 暴击！！', 'effective');
    if (multi > 1.2) addLog('🔥 克制效果！伤害 ×'+multi.toFixed(1), 'effective');
    if (multi < 0.8) addLog('💔 抗性…伤害 ×'+multi.toFixed(1), 'resisted');
    addLog('⚔️ '+sk.emoji+' '+sk.name+' → 造成 '+finalDmg+' 伤害！', 'skill-use');
    updateHpBars();
  }

  // 检查敌人是否死亡
  if (mb.enHp <= 0) {
    mb.enHp = 0;
    updateHpBars();
    setTimeout(function(){ endBattle(true); }, 800);
    return;
  }

  // 检查 stun
  var stunned = false;
  if (sk.stunChance && Math.random() * 100 < sk.stunChance) {
    stunned = true;
    addLog('🧊 极寒冻结！对手跳过回合！', 'stun');
  }

  // 敌人回合
  if (stunned) {
    reduceCooldowns();
    setTimeout(function() {
      mb.myTurn = true;
      disableAllSkills(false);
      updateSkillButtons();
      if (mb.over) return;
      addLog('⏳ 轮到你了！', '');
    }, 600);
    return;
  }

  setTimeout(function() {
    enemyTurn();
  }, 700);
}

function enemyTurn() {
  var mb = _mb;
  if (!mb || mb.over) return;

  reduceCooldowns();
  var enSkills = SKILL_DB[mb.enPet.element];
  // AI: 优先用高伤害技能（加权随机）
  var weights = enSkills.map(function(s, i){ return s.dmg ? (s.dmg * (s.cd > 0 ? 0.7 : 1)) : 0; });
  var totalW = weights.reduce(function(a,b){ return a+b; }, 0);
  var r = Math.random() * totalW;
  var pick = 0, acc = 0;
  for (var i = 0; i < weights.length; i++) { acc += weights[i]; if (r <= acc) { pick = i; break; } }
  var es = enSkills[pick];

  var rawDmg = es.dmg || 40;
  var baseDmg = Math.floor(rawDmg * (0.85 + Math.random() * 0.3));
  var multi = mb.enAdv;
  var isCrit = Math.random() < 0.08;
  if (isCrit) multi *= 1.5;
  var finalDmg = Math.floor(baseDmg * multi);

  mb.myHp = Math.max(0, mb.myHp - finalDmg);

  var dmgColor = multi > 1.2 ? '#FACC15' : (multi < 0.8 ? '#F97316' : '#fff');
  var dmgText = '-'+finalDmg;

  var plSprite = document.getElementById('playerSprite');
  if (plSprite) { plSprite.classList.remove('hit'); void plSprite.offsetWidth; plSprite.classList.add('hit'); }
  showDmgNum('playerSprite', dmgText, dmgColor, '');
  if (isCrit) addLog('💥 敌人暴击！', 'resisted');
  if (multi > 1.2) addLog('💔 被克制！伤害 ×'+multi.toFixed(1), 'resisted');
  addLog('👊 '+es.emoji+' '+es.name+' ← 造成 '+finalDmg+' 伤害', '');
  updateHpBars();

  if (mb.myHp <= 0) {
    mb.myHp = 0;
    updateHpBars();
    setTimeout(function(){ endBattle(false); }, 800);
    return;
  }

  setTimeout(function() {
    mb.myTurn = true;
    disableAllSkills(false);
    updateSkillButtons();
    if (mb.over) return;
    addLog('⏳ 轮到你了！选择一个技能', '');
  }, 600);
}

function reduceCooldowns() {
  var mb = _mb;
  if (!mb) return;
  mb.skills.forEach(function(sk) { if (sk.curCd > 0) sk.curCd--; });
}

function updateSkillButtons() {
  var mb = _mb;
  if (!mb) return;
  mb.skills.forEach(function(sk, i) {
    var btn = document.getElementById('skBtn'+i);
    if (!btn) return;
    var cdEl = btn.querySelector('.sk-cd');
    if (sk.curCd > 0) {
      btn.disabled = true;
      btn.classList.add('on-cd');
      if (!cdEl) {
        cdEl = document.createElement('span');
        cdEl.className = 'sk-cd';
        cdEl.style.cssText = 'display:block;font-size:9px;color:#EF4444;margin-top:2px;';
        btn.appendChild(cdEl);
      }
      cdEl.textContent = '冷却 '+sk.curCd+'回合';
    } else {
      btn.disabled = false;
      btn.classList.remove('on-cd');
      if (cdEl) cdEl.remove();
    }
  });
  // 禁用所有技能如果非我方回合
  if (!mb.myTurn || mb.over) disableAllSkills(true);
}

function disableAllSkills(v) {
  var mb = _mb;
  if (!mb) return;
  mb.skills.forEach(function(sk, i) {
    var btn = document.getElementById('skBtn'+i);
    if (btn) btn.disabled = v;
  });
}

function endBattle(won) {
  var mb = _mb;
  if (!mb || mb.over) return;
  mb.over = true;
  disableAllSkills(true);

  var battleStage = document.getElementById('battleStage');
  if (!battleStage) return;

  var overlay = document.createElement('div');
  overlay.className = 'result-overlay ' + (won ? 'win' : 'lose');
  overlay.id = 'resultOverlay';
  if (won) {
    overlay.innerHTML = '<div class="result-title">🏆 胜利！</div><div class="result-sub">你击败了 '+mb.enPet.name+'！</div><button class="replay-btn" style="margin:0;" onclick="renderManualBattle()">🔄 再来一局</button>';
  } else {
    overlay.innerHTML = '<div class="result-title">💔 败北…</div><div class="result-sub">你被 '+mb.enPet.name+' 打败了</div><button class="replay-btn" style="margin:0;" onclick="renderManualBattle()">🔄 再来一局</button>';
  }
  battleStage.appendChild(overlay);
}

function showDmgNum(targetId, text, color, extraClass) {
  var target = document.getElementById(targetId);
  if (!target) return;
  var parent = target.parentElement;
  var rect = target.getBoundingClientRect();
  var pRect = parent.getBoundingClientRect();
  var x = rect.left - pRect.left + rect.width/2;
  var y = rect.top - pRect.top;

  var el = document.createElement('div');
  el.className = 'dmg-num' + (extraClass ? ' '+extraClass : '');
  el.textContent = text;
  el.style.color = color;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  parent.appendChild(el);
  setTimeout(function(){ el.remove(); }, 1000);
}

function updateHpBars() {
  var mb = _mb;
  if (!mb) return;

  var myPct = Math.max(0, mb.myHp / mb.myMaxHp * 100);
  var enPct = Math.max(0, mb.enHp / mb.enMaxHp * 100);

  var myBar = document.getElementById('myHpBar');
  var enBar = document.getElementById('enHpBar');
  var myTxt = document.getElementById('myHpText');
  var enTxt = document.getElementById('enHpText');

  if (myBar) { myBar.style.width = myPct + '%'; myBar.className = 'hp-bar-inner ' + getHpClass(mb.myHp, mb.myMaxHp); }
  if (enBar) { enBar.style.width = enPct + '%'; enBar.className = 'hp-bar-inner ' + getHpClass(mb.enHp, mb.enMaxHp); }
  if (myTxt) myTxt.textContent = mb.myHp;
  if (enTxt) enTxt.textContent = mb.enHp;
}

function getHpClass(hp, max) {
  var pct = hp / max;
  if (pct > 0.5) return 'high';
  if (pct > 0.2) return 'mid';
  return 'low';
}

function addLog(msg, cls) {
  var log = document.getElementById('battleLog');
  if (!log) return;
  var div = document.createElement('div');
  div.className = 'battle-log-msg' + (cls ? ' '+cls : '');
  div.textContent = msg;
  log.insertBefore(div, log.firstChild);
}

  var s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';

function init3DScene() {
  var wrap = document.getElementById('canvas3dWrap');
  if (!wrap || !_mb3d) return;

  var W = wrap.clientWidth || 420;
  var H = W; // 正方形

  // Scene
  var scene = new THREE.Scene();

  // 混合两个精灵的元素颜色做氛围
  var myViz = EL_3D[_mb3d.myPet.element];
  var enViz = EL_3D[_mb3d.enPet.element];
  var bgColor = new THREE.Color(myViz.bg);
  bgColor.lerp(new THREE.Color(enViz.bg), 0.5);
  scene.background = bgColor;
  scene.fog = new THREE.FogExp2(bgColor, 0.0008);

  // Camera
  var camera = new THREE.PerspectiveCamera(60, W/H, 0.1, 100);
  camera.position.set(0, 2.0, 5.5);

function createCardTexture(pet, stage, viz) {
  var canvas = document.createElement('canvas');
  canvas.width = 256;
  canvas.height = 320;
  var ctx = canvas.getContext('2d');

  var params = EVO_CARD_PARAMS[Math.min(stage, 4)];
  var stg = pet.stages[Math.min(stage, pet.stages.length - 1)];

  // 深色背景 + 渐变
  var grad = ctx.createRadialGradient(128, 160, 20, 128, 160, 200);
  grad.addColorStop(0, viz.bg);
  grad.addColorStop(0.7, 'rgba(0,0,0,0.9)');
  grad.addColorStop(1, '#000000');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 256, 320);

  // 边框光晕（Pokémon进化风格：越高级越华丽）
  var borderGrad = ctx.createLinearGradient(0, 0, 256, 320);
  borderGrad.addColorStop(0, params.frameColor);
  borderGrad.addColorStop(0.3, viz.glow);
  borderGrad.addColorStop(0.7, viz.glow);
  borderGrad.addColorStop(1, params.frameColor);
  ctx.strokeStyle = borderGrad;
  ctx.lineWidth = 4 + stage * 1.5;
  ctx.shadowColor = viz.glow;
  ctx.shadowBlur = 15 + stage * 8;
  ctx.strokeRect(6, 6, 244, 308);
  ctx.shadowBlur = 0;

  // 内边框
  ctx.strokeStyle = 'rgba(255,255,255,'+(0.1+stage*0.08)+')';
  ctx.lineWidth = 1;
  ctx.strokeRect(12, 12, 232, 296);

  // 装饰角标（高级阶段有）
  if (stage >= 3) {
    ctx.fillStyle = viz.glow;
    ctx.globalAlpha = 0.4;
    // 四角小菱形
    [[14,14],[228,14],[14,292],[228,292]].forEach(function(p) {
      ctx.beginPath();
      ctx.moveTo(p[0], p[1]-6); ctx.lineTo(p[0]+6, p[1]); ctx.lineTo(p[0], p[1]+6); ctx.lineTo(p[0]-6, p[1]);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  // 精灵 Emoji（主体）
  ctx.font = (60 + stage * 14) + 'px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = viz.glow;
  ctx.shadowBlur = 20 + stage * 8;
  ctx.fillText(stg.e, 128, 140);
  ctx.shadowBlur = 0;

  // 光晕环
  if (stage >= 2) {
    ctx.beginPath();
    ctx.arc(128, 140, 55 + stage * 8, 0, Math.PI * 2);
    ctx.strokeStyle = viz.glow;
    ctx.lineWidth = 1 + stage * 0.5;
    ctx.globalAlpha = 0.3 + stage * 0.1;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // 精灵名称
  ctx.font = 'bold ' + (12 + stage * 2) + 'px sans-serif';
  ctx.fillStyle = '#fff';
  ctx.shadowColor = viz.glow;
  ctx.shadowBlur = 6;
  ctx.fillText(stg.n, 128, 215);
  ctx.shadowBlur = 0;

  // 进化阶段标签
  ctx.font = '9px sans-serif';
  ctx.fillStyle = viz.glow;
  ctx.globalAlpha = 0.8;
  ctx.fillText('Stage ' + (stage + 1) + ' · ' + params.name, 128, 240);
  ctx.globalAlpha = 1;

  // 底部元素标记
  var el = TYPE_CHART[pet.element];
  ctx.font = '10px sans-serif';
  ctx.fillStyle = el.color;
  ctx.fillText(el.emoji + ' ' + el.label + '系', 128, 265);

  // 稀有度星星（高级阶段更多）
  var rarityStars = stage + 1;
  ctx.font = '12px serif';
  for (var s = 0; s < rarityStars; s++) {
    ctx.fillStyle = s < stage ? '#FFD700' : '#555';
    ctx.fillText('★', 98 + s * 18, 288);
  }

  return canvas;
}

function createCard3D(pet, stage, viz, x, isPlayer) {

function createElementParticles(viz, x, count) {
  var geo = new THREE.BufferGeometry();
  var positions = new Float32Array(count * 3);
  var colors = new Float32Array(count * 3);
  var color = new THREE.Color(viz.pColor);

  for (var i = 0; i < count; i++) {
    positions[i*3] = x + (Math.random() - 0.5) * 1.8;
    positions[i*3+1] = -0.5 + Math.random() * 3.0;
    positions[i*3+2] = (Math.random() - 0.5) * 1.8;
    colors[i*3] = color.r;
    colors[i*3+1] = color.g;
    colors[i*3+2] = color.b;
  }

  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  var mat = new THREE.PointsMaterial({
    size: viz.pSize,
    vertexColors: true,
    transparent: true,
    opacity: 0.6,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });

  var particles = new THREE.Points(geo, mat);
  particles.userData = { viz: viz, x: x, count: count };
  return particles;
}

function animate3D() {
  _3dAnimId = requestAnimationFrame(animate3D);
  if (!_3d || !_mb3d) return;

  var dt = Math.min(_3d.clock.getDelta(), 0.1);
  var t = performance.now() * 0.001;

  // 玩家卡片浮动
  if (_3d.myCard && _3d.myCard.group) {
    _3d.myCard.group.position.y = _3d.myCard.baseY + Math.sin(t * 1.5) * 0.07;

  // 敌人卡片浮动

    _3d.enCard.group.position.y = _3d.enCard.baseY + Math.sin(t * 1.5 + Math.PI) * 0.07;

  // 粒子动画
  if (_3d.myParticles) {
    var posArr = _3d.myParticles.geometry.attributes.position.array;
    var pCount = _3d.myParticles.userData.count;
    var px = _3d.myParticles.userData.x;
    for (var i = 0; i < pCount; i++) {
      posArr[i*3+1] += dt * 0.3;
      posArr[i*3] = px + Math.sin(t * 2 + i * 0.5) * 0.6;
      posArr[i*3+2] = Math.cos(t * 1.8 + i * 0.5) * 0.6;
      if (posArr[i*3+1] > 3.0) posArr[i*3+1] = -0.5;
    }
    _3d.myParticles.geometry.attributes.position.needsUpdate = true;
  }

  if (_3d.enParticles) {
    var ePosArr = _3d.enParticles.geometry.attributes.position.array;
    var eCount = _3d.enParticles.userData.count;
    var ex = _3d.enParticles.userData.x;
    for (var j = 0; j < eCount; j++) {
      ePosArr[j*3+1] += dt * 0.3;
      ePosArr[j*3] = ex + Math.sin(t * 1.8 + j * 0.5) * 0.6;
      ePosArr[j*3+2] = Math.cos(t * 2.0 + j * 0.5) * 0.6;
      if (ePosArr[j*3+1] > 3.0) ePosArr[j*3+1] = -0.5;
    }
    _3d.enParticles.geometry.attributes.position.needsUpdate = true;
  }

  // 圆环旋转
  if (_3d.ring) {
    _3d.ring.rotation.z += dt * 0.2;
  }

  // 星空缓慢旋转
  if (_3d.stars) {
    _3d.stars.rotation.y += dt * 0.03;
    _3d.stars.rotation.x += dt * 0.01;
  }

  // 聚光灯轻微摆动
  if (_3d.mySpot) {
    _3d.mySpot.intensity = 1.3 + Math.sin(t * 1.5) * 0.3;
  }
  if (_3d.enSpot) {
    _3d.enSpot.intensity = 1.3 + Math.sin(t * 1.5 + Math.PI) * 0.3;
  }

  // 处理活跃特效（攻击投射物等）
  for (var k = _3d.effects.length - 1; k >= 0; k--) {
    var ef = _3d.effects[k];
    ef.update(dt);
    if (ef.done) {
      if (ef.mesh) _3d.scene.remove(ef.mesh);
      _3d.effects.splice(k, 1);
    }
  }

  _3d.renderer.render(_3d.scene, _3d.camera);
}

function useSkill3D(idx) {
  var mb = _mb3d;
  if (!mb || mb.over || !mb.myTurn) return;
  var sk = mb.skills[idx];
  if (sk.curCd > 0) return;

  mb.myTurn = false;
  mb.selectedSkill = idx;
  disableAllSkills3D(true);

  sk.curCd = sk.cd + 1;

  var rawDmg = sk.dmg || 0;
  var heal = sk.heal || 0;
  var isHeal = heal > 0;
  var baseDmg = isHeal ? 0 : Math.floor(rawDmg * (0.85 + Math.random() * 0.3));
  var multi = mb.adv;
  var isCrit = Math.random() < 0.1;
  if (isCrit) multi *= 1.5;
  var finalDmg = Math.floor(baseDmg * multi);

  if (isHeal) {
    mb.myHp = Math.min(mb.myMaxHp, mb.myHp + heal);
    updateHpBars3D();
    log3D('💚 '+sk.emoji+' '+sk.name+' → 回复 '+heal+' HP！');

    // 3D回血特效：绿色粒子从卡片升起
    spawnHealParticles(-1.8);

    setTimeout(function() { endPlayerTurn3D(); }, 800);
    return;
  }

  mb.enHp = Math.max(0, mb.enHp - finalDmg);

  // 3D攻击投射物
  spawnAttackProjectile(-1.8, 1.8, sk, isCrit, multi);

  // 延迟执行受击反馈
  setTimeout(function() {
    if (isCrit) log3D('💥 暴击！！');
    if (multi > 1.2) log3D('🔥 克制效果！伤害 ×'+multi.toFixed(1));
    if (multi < 0.8) log3D('💔 抗性…伤害 ×'+multi.toFixed(1));
    log3D('⚔️ '+sk.emoji+' '+sk.name+' → 造成 '+finalDmg+' 伤害！');

    // 敌人受击震动
    shakeCard3D(_3d.enCard, 0.5);

    updateHpBars3D();

    if (mb.enHp <= 0) {
      mb.enHp = 0;
      updateHpBars3D();
      setTimeout(function() { endBattle3D(true); }, 600);
      return;
    }

    // 敌人回合
    setTimeout(function() { enemyTurn3D(); }, 800);
  }, 400);
}

function enemyTurn3D() {
  var mb = _mb3d;
  if (!mb || mb.over) return;

  reduceCooldowns3D();

  var enSkills = SKILL_DB[mb.enPet.element];
  var weights = enSkills.map(function(s){ return s.dmg ? (s.dmg * (s.cd > 0 ? 0.7 : 1)) : 0; });
  var totalW = weights.reduce(function(a,b){ return a+b; }, 0);
  var r = Math.random() * totalW;
  var pick = 0, acc = 0;
  for (var i = 0; i < weights.length; i++) { acc += weights[i]; if (r <= acc) { pick = i; break; } }
  var es = enSkills[pick];

  var rawDmg = es.dmg || 40;
  var baseDmg = Math.floor(rawDmg * (0.85 + Math.random() * 0.3));
  var multi = mb.enAdv;
  var isCrit = Math.random() < 0.08;
  if (isCrit) multi *= 1.5;
  var finalDmg = Math.floor(baseDmg * multi);

  mb.myHp = Math.max(0, mb.myHp - finalDmg);

  // 敌人攻击投射物
  spawnAttackProjectile(1.8, -1.8, es, isCrit, multi);

  setTimeout(function() {
    if (isCrit) log3D('💥 敌人暴击！');
    if (multi > 1.2) log3D('💔 被克制！伤害 ×'+multi.toFixed(1));
    log3D('👊 '+mb.enPet.name+' '+es.emoji+' '+es.name+' ← 造成 '+finalDmg+' 伤害');

    shakeCard3D(_3d.myCard, 0.5);
    updateHpBars3D();

    if (mb.myHp <= 0) {
      mb.myHp = 0;
      updateHpBars3D();
      setTimeout(function() { endBattle3D(false); }, 600);
      return;
    }

    setTimeout(function() {
      mb.myTurn = true;
      disableAllSkills3D(false);
      updateSkillButtons3D();
      if (mb.over) return;
      log3D('⏳ 轮到你了！');
    }, 500);
  }, 400);
}

function spawnAttackProjectile(fromX, toX, skill, isCrit, multi) {
  if (!_3d) return;

  var isHeal = !!skill.heal;
  var colorHex = isHeal ? 0x4ADE80 : (isCrit ? 0xFFD700 : (multi > 1.2 ? 0xFACC15 : (multi < 0.8 ? 0xF97316 : 0xFFFFFF)));
  var size = isCrit ? 0.15 : 0.08;

  // 投射物球体
  var projGeo = new THREE.SphereGeometry(size, 8, 8);
  var projMat = new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.9 });
  var projMesh = new THREE.Mesh(projGeo, projMat);
  projMesh.position.set(fromX, 0.5, 0);
  _3d.scene.add(projMesh);

  // 拖尾粒子
  var trailGeo = new THREE.BufferGeometry();
  var trailCount = 15;
  var trailPos = new Float32Array(trailCount * 3);
  trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPos, 3));
  var trailMat = new THREE.PointsMaterial({ color: colorHex, size: 0.06, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending, depthWrite: false });
  var trailMesh = new THREE.Points(trailGeo, trailMat);
  _3d.scene.add(trailMesh);

  var elapsed = 0;
  var duration = 0.35;
  var trailHistory = [];

  var effect = {
    mesh: projMesh,
    done: false,
    update: function(dt) {
      elapsed += dt;
      var progress = Math.min(elapsed / duration, 1);
      // ease in-out
      var t = progress < 0.5 ? 2*progress*progress : -1+(4-2*progress)*progress;

      projMesh.position.x = fromX + (toX - fromX) * t;
      projMesh.position.y = 0.5 + Math.sin(t * Math.PI) * 1.2;
      projMesh.position.z = Math.sin(t * Math.PI) * 0.4;

      // 拖尾
      trailHistory.push({ x: projMesh.position.x, y: projMesh.position.y, z: projMesh.position.z });
      if (trailHistory.length > trailCount) trailHistory.shift();

      for (var i = 0; i < trailCount; i++) {
        var idx = trailHistory.length - 1 - i;
        if (idx >= 0) {
          var h = trailHistory[idx];
          trailPos[i*3] = h.x;
          trailPos[i*3+1] = h.y;
          trailPos[i*3+2] = h.z;
        } else {
          trailPos[i*3] = fromX;
          trailPos[i*3+1] = -10;
          trailPos[i*3+2] = 0;
        }
      }
      trailMesh.geometry.attributes.position.needsUpdate = true;

      if (progress >= 1) {
        _3d.scene.remove(projMesh);
        _3d.scene.remove(trailMesh);
        this.done = true;
      }
    }
  };

  _3d.effects.push(effect);
}

function spawnHealParticles(x) {
  if (!_3d) return;
  var count = 30;
  var geo = new THREE.BufferGeometry();
  var pos = new Float32Array(count * 3);
  for (var i = 0; i < count; i++) {
    pos[i*3] = x + (Math.random() - 0.5) * 0.5;
    pos[i*3+1] = 0.2;
    pos[i*3+2] = (Math.random() - 0.5) * 0.5;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  var mat = new THREE.PointsMaterial({ color: 0x4ADE80, size: 0.06, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false });
  var mesh = new THREE.Points(geo, mat);
  _3d.scene.add(mesh);

  var elapsed = 0;
  var effect = {
    mesh: mesh,
    done: false,
    update: function(dt) {
      elapsed += dt;
      var pArr = mesh.geometry.attributes.position.array;
      for (var i = 0; i < count; i++) {
        pArr[i*3+1] += dt * 1.2;
        pArr[i*3] += (Math.random() - 0.5) * dt * 0.5;
        pArr[i*3+2] += (Math.random() - 0.5) * dt * 0.5;
      }
      mesh.geometry.attributes.position.needsUpdate = true;
      mesh.material.opacity = Math.max(0, 0.9 - elapsed * 0.8);
      if (elapsed > 1.2) {
        _3d.scene.remove(mesh);
        this.done = true;
      }
    }
  };
  _3d.effects.push(effect);
}

function shakeCard3D(card, duration) {
  if (!card || !card.group) return;
  var origX = card.group.position.x;
  var origRot = card.group.rotation.z;
  var elapsed = 0;
  var intensity = 0.08;

  var effect = {
    mesh: null,
    done: false,
    update: function(dt) {
      elapsed += dt;
      if (elapsed < duration) {
        card.group.position.x = origX + Math.sin(elapsed * 40) * intensity * (1 - elapsed / duration);
        card.group.rotation.z = origRot + Math.sin(elapsed * 35) * intensity * 0.5 * (1 - elapsed / duration);
      } else {
        card.group.position.x = origX;
        card.group.rotation.z = origRot;
        this.done = true;
      }
    }
  };
  _3d.effects.push(effect);
}

// ===== 3D UI 更新 =====

function updateHpBars3D() {
  var mb = _mb3d;
  if (!mb) return;
  var myPct = Math.max(0, mb.myHp / mb.myMaxHp * 100);
  var enPct = Math.max(0, mb.enHp / mb.enMaxHp * 100);

  var myBar = document.getElementById('myHpBar3d');
  var enBar = document.getElementById('enHpBar3d');
  var myTxt = document.getElementById('myHpText3d');
  var enTxt = document.getElementById('enHpText3d');

  if (myBar) { myBar.style.width = myPct + '%'; myBar.className = 'hp-bar-inner ' + getHpClass(mb.myHp, mb.myMaxHp); }
  if (enBar) { enBar.style.width = enPct + '%'; enBar.className = 'hp-bar-inner ' + getHpClass(mb.enHp, mb.enMaxHp); }
  if (myTxt) myTxt.textContent = mb.myHp;
  if (enTxt) enTxt.textContent = mb.enHp;
}

function log3D(msg) {
  var el = document.getElementById('battleLog3d');
  if (!el) return;
  el.innerHTML = '<div style="font-size:11px;opacity:0.7;text-shadow:0 0 10px rgba(255,255,255,0.5);">'+msg+'</div>';
}

function disableAllSkills3D(v) {
  var mb = _mb3d;
  if (!mb) return;
  mb.skills.forEach(function(sk, i) {
    var btn = document.getElementById('skBtn3d_'+i);
    if (btn) btn.disabled = v;
  });
}

function updateSkillButtons3D() {
  var mb = _mb3d;
  if (!mb) return;
  mb.skills.forEach(function(sk, i) {
    var btn = document.getElementById('skBtn3d_'+i);
    if (!btn) return;
    var cdEl = btn.querySelector('.sk-cd');
    if (sk.curCd > 0) {
      btn.disabled = true;
      btn.classList.add('on-cd');
      if (!cdEl) {
        cdEl = document.createElement('span');
        cdEl.className = 'sk-cd';
        cdEl.textContent = '冷却 '+sk.curCd+'回合';
        btn.appendChild(cdEl);
      } else {
        cdEl.textContent = '冷却 '+sk.curCd+'回合';
      }
    } else {
      btn.disabled = false;
      btn.classList.remove('on-cd');
      if (cdEl) cdEl.remove();
    }
  });
  if (!mb.myTurn || mb.over) disableAllSkills3D(true);
}

function reduceCooldowns3D() {
  var mb = _mb3d;
  if (!mb) return;
  mb.skills.forEach(function(sk) { if (sk.curCd > 0) sk.curCd--; });
}

function endBattle3D(won) {
  var mb = _mb3d;
  if (!mb || mb.over) return;
  mb.over = true;
  disableAllSkills3D(true);

  if (won) {
    log3D('🏆 胜利！击败了 '+mb.enPet.name+'！');
    // 胜利闪光
    if (_3d && _3d.scene) {
      var flashGeo = new THREE.SphereGeometry(0.1, 8, 8);
      var flashMat = new THREE.MeshBasicMaterial({ color: 0xFFD700, transparent: true, opacity: 2 });
      var flash = new THREE.Mesh(flashGeo, flashMat);
      flash.position.set(0, 0.5, 0);
      _3d.scene.add(flash);
      var elapsed = 0;
      _3d.effects.push({
        mesh: flash,
        done: false,
        update: function(dt) {
          elapsed += dt;
          flash.scale.setScalar(1 + elapsed * 8);
          flash.material.opacity = Math.max(0, 2 - elapsed * 1.5);
          if (elapsed > 1.5) { _3d.scene.remove(flash); this.done = true; }
        }
      });
    }
  } else {
    log3D('💔 败北…被 '+mb.enPet.name+' 打败了');
  }
}

// ===== 工具函数 =====
function ensureShakeStyle() {
  if (!document.getElementById('shakeStyle')) {
    var s = document.createElement('style');
    s.id = 'shakeStyle';
    s.textContent = '';
    document.head.appendChild(s);
  }
}

// 初始加载
renderWildBattle();
</script>
